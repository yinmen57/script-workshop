id: plan-shots
name: 规划分镜
description: |
  基于已解析资产与叙事空间生成分镜计划。
  用途：叙事空间已就绪，需要镜头级描述时。
  前置：项目有 style_bible；目标叙事空间存在。可指定 narrative_space_id；缺省则处理尚未有确认分镜的空间。
  产出：shot_plan。
  是否修改数据：是，重跑只清 ai 分镜。
  是否产生费用：调用 LLM。
  不适用：不要用它编视频片段；编组用 plan-video-segments。
risk_level: low
entrypoint: src/tools.py:plan_shots
parameters:
  type: object
  properties:
    project_id:
      type: string
      description: 剧本项目 id
    narrative_space_id:
      type: string
      description: 可选；只规划这一个叙事空间
  required: [project_id]
