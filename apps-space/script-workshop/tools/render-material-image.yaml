id: render-material-image
name: 生成物料图
description: |
  通过赏舞为已确认物料提示词生图，并落 OSS。
  用途：物料提示词已确认，用户明确要求出图。
  前置：material_prompt 的 record_status 必须是 confirmed。
  产出：material_image。
  是否修改数据：是。
  是否产生费用：是，会消耗赏舞余额。
  不适用：提示词未确认时不要调用；不要用它生成视频。
risk_level: medium
entrypoint: src/tools.py:render_material_image
parameters:
  type: object
  properties:
    material_prompt_id:
      type: string
      description: 已确认的物料提示词 id
  required: [material_prompt_id]
