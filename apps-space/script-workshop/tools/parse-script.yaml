id: parse-script
name: 解析剧本
description: |
  将剧本文本解析为风格圣经、人物、归属道具，并顺带规则切结构。
  用途：项目首次解析，或用户要求重新提取资产。
  前置：项目已有剧本文档，或本次传入 script_text。
  产出：style_bible、character_asset、prop_asset；重跑只清 ai。
  是否修改数据：是。
  是否产生费用：调用 LLM，不计生图费用。
  不适用：只想粗切目录时用 parse-structure；只想语义切分用 segment-narrative。
risk_level: low
entrypoint: src/tools.py:parse_script
parameters:
  type: object
  properties:
    project_id:
      type: string
      description: 剧本项目 id
    script_text:
      type: string
      description: 可选；缺省时取项目最新剧本文档全文
  required: [project_id]
