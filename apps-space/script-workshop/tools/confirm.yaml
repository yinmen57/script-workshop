id: confirm
name: 定版确认
description: |
  将指定产物标记为 confirmed（定版）。定版后普通重跑不会覆盖。
  用途：用户明确说「确认」「定版」「锁定」时使用。
  前置：目标对象必须存在且属于该项目。
  产出：目标 record_status 变为 confirmed。
  是否修改数据：是。
  是否清理 AI 产物：否。
  是否产生费用：否。
  不适用：用户只是查看或生成草稿时不要自动确认；反悔请用 revert。
  容易混淆：confirm 是定版，revert 是按历史 revision 写回。
risk_level: medium
entrypoint: src/tools.py:confirm
parameters:
  type: object
  properties:
    project_id:
      type: string
      description: 剧本项目 id
    target_type:
      type: string
      description: 要定版的对象类型
      enum:
        - character
        - prop
        - shot
        - segment
        - video_prompt
        - material_prompt
        - narrative_space
    target_id:
      type: string
      description: 目标对象 id
  required: [project_id, target_type, target_id]
