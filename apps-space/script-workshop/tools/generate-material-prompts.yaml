id: generate-material-prompts
name: 生成物料提示词
description: |
  为人物与归属道具生成可编辑的物料提示词。
  用途：资产已解析，需要出人物/道具提示词时。
  前置：项目已有 style_bible 与人物/道具资产。
  产出：material_prompt（重跑只清 ai）。
  是否修改数据：是。
  是否产生费用：调用 LLM；真正生图是 render-material-image。
  不适用：不要用它生成成片视频提示词（那是 generate-video-prompts）。
risk_level: low
entrypoint: src/tools.py:generate_material_prompts
parameters:
  type: object
  properties:
    project_id:
      type: string
      description: 剧本项目 id
  required: [project_id]
