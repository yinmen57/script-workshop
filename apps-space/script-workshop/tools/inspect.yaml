id: inspect
name: 巡检项目状态
description: |
  只读查询项目当前进度与产物状态，供选择下一步工具前使用。同步返回，不创建作业。
  用途：先看项目做到哪一步，再决定调用哪个写工具。
  前置：需要有效的 project_id。
  产出：按 scope 返回摘要（id、归属、status、record_status、计数），不返回正文大字段。
  是否修改数据：否。
  是否产生费用：否。
  不适用：不要用它生成、确认或覆盖任何产物。
  建议：模糊目标或不确定进度时，先 inspect scope=progress。
risk_level: low
entrypoint: src/tools.py:inspect
parameters:
  type: object
  properties:
    project_id:
      type: string
      description: 剧本项目 id，形如 sprj_xxx
    scope:
      type: string
      description: 查询范围
      enum:
        - progress
        - structure
        - assets
        - shots
        - segments
        - materials
        - jobs
    narrative_space_id:
      type: string
      description: 可选，限定某个叙事空间；shots / segments 时常用
    video_segment_id:
      type: string
      description: 可选，只查某一个视频片段；scope=segments 时生效
    episode_id:
      type: string
      description: 可选，只查某一集；scope=structure 时生效
    job_status:
      type: string
      description: 可选，按作业状态过滤；scope=jobs 时生效
      enum: [queued, running, done, failed, cancelled]
    limit:
      type: integer
      description: 返回条数上限，默认 50，最大 200
  required: [project_id, scope]
