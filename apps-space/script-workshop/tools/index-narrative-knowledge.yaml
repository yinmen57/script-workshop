id: index-narrative-knowledge
name: 索引项目知识库
description: |
  从工作台事实重建项目知识库检索副本：叙事空间 + 人物 + 场景。
  命名空间 script/project/{project_id} 整库覆盖写入。
  用途：语义切分 / 资产解析完成后，需要按场次或人物检索时入库。
  前置：项目已有叙事空间、人物或场景至少一类。
  产出：替换项目命名空间下的检索副本（不是唯一事实）。
  是否修改数据：是（向量库）；不改 MySQL 资产。
  是否产生费用：调用 embedding。
  不适用：上传阶段不要自动盲切索引；工作台尚未解析出任何内容时不要调用。
  注意：知识库是可重建副本；人物外貌/场景锚点/确认状态以工作台 DB 为准。
risk_level: low
entrypoint: src/tools.py:index_narrative_knowledge
parameters:
  type: object
  properties:
    project_id:
      type: string
      description: 剧本项目 id
  required: [project_id]
