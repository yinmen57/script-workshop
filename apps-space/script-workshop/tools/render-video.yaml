id: render-video
name: 生成成片视频
description: |
  通过赏舞为已确认成片提示词生成视频，并落 OSS。
  用途：成片提示词已确认，用户明确要求出视频。
  前置：video_prompt 的 record_status 必须是 confirmed。
  产出：video_job / 视频文件。
  是否修改数据：是。
  是否产生费用：是，会消耗赏舞余额。
  不适用：提示词未确认或用户只是查看时不要调用；不要用它生成物料图。
risk_level: medium
entrypoint: src/tools.py:render_video
parameters:
  type: object
  properties:
    video_prompt_id:
      type: string
      description: 已确认的成片视频提示词 id
  required: [video_prompt_id]
