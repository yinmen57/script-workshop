services:
  mysql:
    image: mysql:8.4
    container_name: ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_platform}
      MYSQL_USER: ${MYSQL_USER:-ai_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql}
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./configs/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ai-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      # guest ???????????????????
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ai_platform}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: ai-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ?? API????? / ???? / ?? / AI Key / ??
  # ???????? OSS?.env ? OSS_*???????? MinIO
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-api
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--app-dir",
        "/app/apps/api",
      ]
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ai}:${RABBITMQ_PASSWORD:-ai_platform}@rabbitmq:5672//
    ports:
      - "${APP_PORT:-42867}:8000"
    volumes:
      - ./framework:/app/framework:ro
      - ./business:/app/business:ro
      - ./apps/api:/app/apps/api:ro
      - ./alembic:/app/alembic:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ?? API?? /api/v1/script-biz
  biz-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-biz-api
    restart: unless-stopped
    command:
      [
        "uvicorn",
        "app.biz_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--app-dir",
        "/app/apps/api",
      ]
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ai}:${RABBITMQ_PASSWORD:-ai_platform}@rabbitmq:5672//
    ports:
      - "${BIZ_APP_PORT:-42868}:8000"
    volumes:
      - ./framework:/app/framework:ro
      - ./business:/app/business:ro
      - ./apps/api:/app/apps/api:ro
      - ./alembic:/app/alembic:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  celery-worker-sync:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-celery-sync
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "business.jobs.celery_app",
        "worker",
        "-Q",
        "sync",
        "-c",
        "2",
        "-l",
        "INFO",
        "-n",
        "sync@%h",
      ]
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ai}:${RABBITMQ_PASSWORD:-ai_platform}@rabbitmq:5672//
    volumes:
      - ./framework:/app/framework:ro
      - ./business:/app/business:ro
      - ./alembic:/app/alembic:ro
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true

  celery-worker-gen:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-celery-gen
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "business.jobs.celery_app",
        "worker",
        "-Q",
        "gen.submit,gen.finalize",
        "-c",
        "2",
        "-l",
        "INFO",
        "-n",
        "gen@%h",
      ]
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ai}:${RABBITMQ_PASSWORD:-ai_platform}@rabbitmq:5672//
    volumes:
      - ./framework:/app/framework:ro
      - ./business:/app/business:ro
      - ./alembic:/app/alembic:ro
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true

  celery-beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-celery-beat
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "business.jobs.celery_app",
        "beat",
        "-l",
        "INFO",
      ]
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ai}:${RABBITMQ_PASSWORD:-ai_platform}@rabbitmq:5672//
    volumes:
      - ./framework:/app/framework:ro
      - ./business:/app/business:ro
      - ./alembic:/app/alembic:ro
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
