services:
  mysql:
    image: mysql:8.4
    container_name: ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_platform}
      MYSQL_USER: ${MYSQL_USER:-ai_platform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql}
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./configs/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: ai-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 后端 API：Docker 部署；前端本地 npm 运行
  # 对象存储走阿里云 OSS（.env 的 OSS_*），不在本机部署 MinIO
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      # 容器内走服务名与内部端口
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      # 宿主机上的 Xinference（Windows/Mac Docker Desktop 可用）
      XINFERENCE_BASE_URL: ${XINFERENCE_BASE_URL_DOCKER:-http://host.docker.internal:9997}
    ports:
      - "${APP_PORT:-42867}:8000"
    volumes:
      # 本地开发时让管理端重新加载宿主机中的 Agent 应用空间
      - ./apps-space:/app/apps-space:ro
      - ./packages:/app/packages:ro
      - ./apps/worker:/app/apps/worker:ro
      - ./alembic:/app/alembic:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 剧本业务作业 Worker（与 api 同镜像）
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-worker
    restart: unless-stopped
    command: ["python", "-m", "apps.worker"]
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      XINFERENCE_BASE_URL: ${XINFERENCE_BASE_URL_DOCKER:-http://host.docker.internal:9997}
    volumes:
      - ./apps-space:/app/apps-space:ro
      - ./packages:/app/packages:ro
      - ./apps/worker:/app/apps/worker:ro
      - ./alembic:/app/alembic:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      disable: true

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
